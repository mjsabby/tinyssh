[package]
name = "tinyssh"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Minimal, panic-free SSHv2 server library: one cipher suite, public-key auth, one interactive session"
categories = ["network-programming"]
keywords = ["ssh", "server", "pty", "conpty"]

[dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "macros"] }

# `Notify` wakes a session from thread-pool I/O completions (src/sys/windows.rs).
[target.'cfg(windows)'.dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }

[dev-dependencies]
# Reference implementations for the cryptography tests only.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast"] }
sha2 = { version = "0.11.1", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-util", "process"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["precomputed-tables", "static_secrets"] }

# Keep the crypto dependencies fast in debug builds (tests move many megabytes),
# while tinyssh itself stays a debug build with debug assertions enabled.
[profile.dev.package."*"]
opt-level = 3

# The published binaries (`cargo build --profile dist --example tinysshd`): a
# release build with full debug information, which CI moves to separate files.
[profile.dist]
inherits = "release"
debug = "full"
